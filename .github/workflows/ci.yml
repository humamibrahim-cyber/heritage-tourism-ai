name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU build keeps CI fast; tests never need a GPU.
          pip install tensorflow-cpu numpy pandas scikit-learn matplotlib \
                      opencv-python-headless openpyxl pytest

      - name: Run tests
        # Tests build model graphs with weights=None, so CI never downloads
        # ImageNet weight files.
        run: pytest tests/ -v --tb=short

      - name: Validate notebooks are well-formed
        run: |
          python - <<'PY'
          import ast, json, pathlib, sys

          failures = []
          for path in pathlib.Path("notebooks").glob("*.ipynb"):
              nb = json.loads(path.read_text())
              for i, cell in enumerate(nb["cells"]):
                  if cell["cell_type"] != "code":
                      continue
                  source = "".join(
                      line if line.endswith("\n") else line + "\n"
                      for line in cell["source"]
                  )
                  try:
                      ast.parse(source)
                  except SyntaxError as exc:
                      failures.append(f"{path.name} cell {i}: {exc}")
              print(f"{path.name}: {len(nb['cells'])} cells OK")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY
